name: CI/CD Triton Inference Server

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Short SHA and Lowercase Image Scope
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          # Convert repository scope to lowercase to satisfy OCI / GHCR requirements
          echo "image_lower=$(echo "${{ github.repository }}/triton-inference-server" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      - name: Generate ONNX Model Artifact
        run: |
          uv run --with torch --with numpy --with onnx --with onnxscript python -c '
          import os, torch, torch.nn as nn

          class SimpleModel(nn.Module):
              def forward(self, x): return x * 2.0

          model = SimpleModel()
          model.eval()
          dummy_input = torch.randn(1, 4, dtype=torch.float32)

          os.makedirs("model_repository/simple/1", exist_ok=True)

          torch.onnx.export(
              model,
              dummy_input,
              "model_repository/simple/1/model.onnx",
              input_names=["INPUT0"],
              output_names=["OUTPUT0"],
              dynamic_axes={"INPUT0": {0: "batch_size"}, "OUTPUT0": {0: "batch_size"}}
          )
          '

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_lower }}
          tags: |
            type=sha,format=short
            latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Deploy / Upgrade Helm Release
        run: |
          helm upgrade --install triton-inference-server ./helm/triton-inference-server \
            --namespace triton \
            --create-namespace \
            --set image.repository=${{ env.REGISTRY }}/${{ steps.vars.outputs.image_lower }} \
            --set image.tag=sha-${{ steps.vars.outputs.sha_short }}