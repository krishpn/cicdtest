name: MLOps Stack CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Lint & Validate Helm Charts
  lint-helm:
    name: Lint Helm Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Lint Triton Chart
        run: |
          helm lint helm/triton-inference-server/

  # 2. Validate Terraform Infrastructure Code
  validate-terraform:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.0'

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive terraform/

      - name: Validate Terraform Files
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

  # 3. Lint & Syntax-Check Ansible Playbooks
  lint-ansible:
    name: Ansible Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible & Linter
        run: |
          python -m pip install --upgrade pip
          pip install ansible-lint ansible

      - name: Run Ansible Syntax Check
        run: |
          ansible-playbook ansible/setup_host.yml --syntax-check

  # 4. Dry-run Docker Container Build
  build-container:
    name: Test Docker Build
    runs-on: ubuntu-latest
    needs: [lint-helm, validate-terraform, lint-ansible]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Triton Engine Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: llm-triton-server:test
