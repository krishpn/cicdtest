apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-service
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: {{ .Values.service.ports.http | int }}
      protocol: TCP
    - name: grpc
      port: 8001
      targetPort: 8001
      nodePort: {{ .Values.service.ports.grpc | int }}
      protocol: TCP
    - name: metrics
      port: 8002
      targetPort: 8002
      nodePort: {{ .Values.service.ports.metrics | int }}
      protocol: TCP