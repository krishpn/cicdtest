replicaCount: 1

image:
  repository: ghcr.io/krishpn/cicdtest/triton-inference-server
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-secret

runtimeClassName: nvidia

resources:
  limits:
    nvidia.com/gpu: 1
    memory: 16Gi
    cpu: "8"
  requests:
    nvidia.com/gpu: 1
    memory: 8Gi
    cpu: "4"

shmSize: 4Gi

service:
  type: NodePort
  ports:
    http: 30800
    grpc: 30801
    metrics: 30802