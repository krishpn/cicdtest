replicaCount: 1

image:
  repository: ghcr.io/krishpn/cicdtest/triton-inference-server
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

runtimeClassName: nvidia

resources:
  limits:
    nvidia.com/gpu: 1
    memory: 16Gi
    cpu: "8"
  requests:
    nvidia.com/gpu: 1
    memory: 8Gi
    cpu: "4"

# Allocated shared memory size for PyTorch/vLLM backends
shmSize: 4Gi

service:
  type: NodePort
  ports:
    http:
      port: 8000
      nodePort: 30800
    grpc:
      port: 8001
      nodePort: 30801
    metrics:
      port: 8002
      nodePort: 30802